services:
  postgres:
    image: postgres:17
    container_name: ai-ops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_ops
      POSTGRES_USER: ai_ops
      POSTGRES_PASSWORD: ai_ops_password

    ports:
    - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-ops-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: